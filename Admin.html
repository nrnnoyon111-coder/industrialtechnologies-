<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background-color: #4285f4; color: white; }
        button:hover { background-color: #357ae8; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>
    <p>Please login with your Google account to access the admin panel.</p>
    <button id="loginBtn">Login with Google</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDI80wJ04fJCXTKZX7sJMsOZGA_G42sQC4",
    authDomain: "ind-tech-admin.firebaseapp.com",
    projectId: "ind-tech-admin",
    storageBucket: "ind-tech-admin.firebasestorage.app",
    messagingSenderId: "580429399032",
    appId: "1:580429399032:web:a2e8c1b27481126061cc0d",
    measurementId: "G-V2GHSG69RP"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  document.getElementById('loginBtn').addEventListener('click', () => {
      auth.signInWithPopup(provider).then((result) => {
          alert('Login successful!');
          // Redirect or change UI here
      }).catch((error) => {
          console.error(error);
          alert('Login failed. Please try again.');
      });
  });
</script>

</body>
</html>
